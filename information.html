```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Sign in to PrivateSpace, your private community for meaningful conversations.">
    <meta name="theme-color" content="#080b18">

    <title>PrivateSpace | Sign In</title>

    <!-- Website fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <!-- Login page stylesheet -->
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <!-- Background lighting effects -->
    <div class="background-glow glow-one" aria-hidden="true"></div>
    <div class="background-glow glow-two" aria-hidden="true"></div>

    <main class="page-container">

        <!-- ================= HEADER ================= -->

        <header class="top-header">

            <a href="./index.html" class="brand" aria-label="PrivateSpace home">

                <span class="brand-icon">P</span>

                <span>
                    Private<span class="brand-light">Space</span>
                </span>

            </a>

            <div class="private-label">
                <span class="status-dot"></span>
                PRIVATE COMMUNITY
            </div>

        </header>


        <!-- ================= LOGIN SECTION ================= -->

        <section class="login-section">

            <div class="login-card">

                <div class="card-decoration" aria-hidden="true"></div>

                <!-- Welcome icon -->
                <div class="welcome-icon" aria-hidden="true">
                    <span>✦</span>
                </div>

                <p class="eyebrow">
                    A PLACE OF YOUR OWN
                </p>

                <h1>
                    Welcome <span>back.</span>
                </h1>

                <p class="subtitle">
                    Sign in to enter your private space.
                    Your conversations belong here.
                </p>


                <!-- LOGIN FORM -->

                <form id="loginForm">

                    <!-- Email address -->
                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <div class="password-heading">

                            <label for="password">
                                Password
                            </label>

                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- Login success and error messages -->
                    <p
                        id="loginMessage"
                        class="login-message"
                        role="status"
                        aria-live="polite">
                    </p>


                    <!-- Submit button -->
                    <button type="submit" id="loginButton">

                        <span>Enter your space</span>

                        <span class="button-arrow" aria-hidden="true">
                            →
                        </span>

                    </button>

                </form>


                <!-- Card footer -->
                <div class="card-footer">

                    <span class="footer-line"></span>

                    <span>MEMBERS ONLY</span>

                    <span class="footer-line"></span>

                </div>

            </div>


            <!-- Bottom message -->
            <p class="bottom-note">
                A quieter corner of the internet.
            </p>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer class="page-footer">

            <span>
                © 2026 PrivateSpace
            </span>

            <span>
                Built for meaningful connections.
            </span>

        </footer>

    </main>


    <!-- Login functionality -->
    <script type="module" src="./login.js"></script>

</body>
</html>
```
